name: Start isolated Supabase verification database
description: Build a disposable local database from repository migrations. Never connects to production.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-supabase
    - name: Start isolated verification database
      shell: bash
      run: |
        set -euo pipefail
        supabase db start
        psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -tAc \
          "select count(*) from information_schema.tables where table_schema = 'public'"
