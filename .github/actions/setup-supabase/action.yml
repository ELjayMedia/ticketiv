name: Install verified Supabase CLI
description: Install the pinned official CLI release after checking its SHA-256 checksum.
runs:
  using: composite
  steps:
    - name: Install Supabase CLI 3.0.0
      shell: bash
      run: |
        set -euo pipefail
        version=3.0.0
        case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) exit 1 ;; esac
        asset="supabase_${version}_linux_${arch}.tar.gz"
        cli_dir="${RUNNER_TEMP}/supabase-cli"
        mkdir -p "$cli_dir"
        cd "$cli_dir"
        for file in "$asset" checksums.txt; do
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --retry-delay 5 --max-time 120 \
            "https://github.com/supabase/cli/releases/download/v${version}/${file}" -o "$file"
        done
        grep " ${asset}$" checksums.txt | sha256sum --check --strict -
        tar -xzf "$asset" supabase
        echo "$cli_dir" >> "$GITHUB_PATH"
        ./supabase --version
