name: Test Corrected Migration Chain

on:
  workflow_dispatch:

jobs:
  test-corrected-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        run: |
          # Start Supabase
          supabase db start
          
          # Wait for database to be ready
          echo "Waiting for database..."
          for i in $(seq 1 30); do
            if PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "Database is ready on port 5432!"
              break
            fi
            sleep 2
          done
          
          # Show status
          supabase status
          
          # Apply migrations in order
          echo "=== Applying baseline ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -f supabase/migrations/20260905000000_production_baseline.sql
          
          echo "=== Applying TICK-395 ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -f supabase/migrations/20260905010000_tick395_add_deltapay_provider_settings.sql
          
          echo "=== Applying TICK-396/397 ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -f supabase/migrations/20260905020000_tick396_397_provider_policy_hierarchy.sql
          
          echo "=== All migrations applied ==="

      - name: Run hierarchy tests
        run: |
          echo "=== Running hierarchy tests ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -f supabase/tests/tick395_396_397_hierarchy_tests.sql

      - name: Security verification
        run: |
          echo "=== Function security check ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "
            SELECT proname, prosecdef, proacl 
            FROM pg_proc 
            WHERE proname = 'fn_get_effective_payment_providers';
          "
          echo ""
          echo "=== Verify service_role can execute ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "
            SELECT has_function_privilege('service_role', 'public.fn_get_effective_payment_providers(uuid, uuid, uuid)', 'execute') as service_role_can_execute;
          "
          echo ""
          echo "=== Verify authenticated CANNOT execute ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "
            SELECT has_function_privilege('authenticated', 'public.fn_get_effective_payment_providers(uuid, uuid, uuid)', 'execute') as authenticated_can_execute;
          "
          echo ""
          echo "=== Verify public CANNOT execute ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "
            SELECT has_function_privilege('public', 'public.fn_get_effective_payment_providers(uuid, uuid, uuid)', 'execute') as public_can_execute;
          "

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
