name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # corepack must be enabled before setup-node so its `cache: pnpm` step can
      # resolve the pnpm store path (otherwise: "Unable to locate executable file: pnpm").
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TICK-466: check:crossorg needs an isolated database with Ticketiv's
      # schema. A throwaway local Supabase Postgres, built from
      # supabase/migrations, lives only for this job. It is never the shared
      # project; the harness also rolls back everything it seeds.
      - name: Start isolated verification database
        uses: ./.github/actions/start-isolated-supabase

      - name: Verify public security controls on isolated database
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f supabase/tests/security_public_surface.sql

      # check:release includes check:permissions. The invariants over the
      # committed matrix always run; the live drift diff additionally runs when
      # these secrets are configured, which is what catches a grant applied
      # straight to the database without a migration (TICK-337).
      - name: Run release verification
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKETIV_CROSS_ORG_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm check:release

      - name: Stop isolated verification database
        if: always()
        run: supabase stop --no-backup || true

  change-scope:
    name: CI change scope
    runs-on: ubuntu-latest
    outputs:
      money_path: ${{ steps.scope.outputs.money_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect money-path changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "money_path=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            diff_range="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              diff_range="$before..${{ github.sha }}"
            else
              diff_range="HEAD^..HEAD"
            fi
          else
            echo "money_path=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$diff_range")"
          printf '%s\n' "$files"

          if printf '%s\n' "$files" | grep -Eq '^(lib/payments(\.ts|/)|lib/orders(\.ts|/)|e2e/discovery-to-checkout\.spec\.ts$|tests/money-path-lifecycle\.test\.ts$|supabase/migrations/.*(payment|paystack|provider|checkout|order|ledger).*)'; then
            echo "money_path=true" >> "$GITHUB_OUTPUT"
          else
            echo "money_path=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-smoke:
    name: E2E smoke (browser)
    runs-on: ubuntu-latest
    needs: [release-gate, change-scope]
    timeout-minutes: 25
    # The money-path suite seeds and tears down shared UAT fixtures in the one
    # Supabase project, so runs from different PRs must not overlap: one run's
    # teardown deletes the event another run is checking out. Same group as
    # shared-uat.yml; queue rather than cancel.
    concurrency:
      group: ticketiv-shared-supabase-uat
      cancel-in-progress: false
    # TICK-407: blocking launch gate. The browser must reach the payment-provider
    # boundary and the database lifecycle must prove paid-order/ticket invariants.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record scoped validation
        if: ${{ needs.change-scope.outputs.money_path != 'true' }}
        run: |
          echo "Money-path E2E is not required for this pull request."
          echo "The blocking money-path suite still runs for payment-relevant changes and explicit workflow dispatches."

      - name: Validate E2E runtime configuration
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY E2E_PAYSTACK_TEST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required blocking E2E configuration: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Playwright browser
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed UAT fixtures
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        id: seed
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
        run: pnpm seed:uat

      - name: Boot test server
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: |
          pnpm dev &
          npx wait-on http://localhost:3000

      - name: Run blocking checkout to payment-handoff E2E
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_STRICT: "1"
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: pnpm test:e2e e2e/discovery-to-checkout.spec.ts --project=desktop-chromium --workers=1

      - name: Prove paid order and issued-ticket lifecycle
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          TEST_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_ALLOW_PROJECT_REF: radsfmlsjznqvcpogluo
          E2E_ALLOW_SHARED_UAT: "1"
        run: pnpm exec vitest run tests/money-path-lifecycle.test.ts

      - name: Remove deterministic UAT fixtures
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' && steps.seed.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm seed:uat:teardown

      - name: Upload Playwright failure artifacts
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Record E2E enforcement mode
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' }}
        run: |
          echo "Blocking money-path gate enabled."
          echo "Browser: event → checkout → Paystack initialization boundary."
          echo "Database: completion → one succeeded payment → paid order → issued ticket → balanced/idempotent settlement."
          echo "Provider-delivered webhook proof remains separate UAT evidence and is not implied by this CI pass."

  deploy-coolify:
    name: Deploy production to Coolify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [release-gate, change-scope, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Synchronize Ticketiv Supabase environment
        env:
          COOLIFY_ENV_TOKEN: ${{ secrets.COOLIFY_ENV_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY }}
          PAYOUT_ENCRYPTION_KEY_ID: ${{ vars.PAYOUT_ENCRYPTION_KEY_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          PROJECT_REF: radsfmlsjznqvcpogluo
        run: |
          set -euo pipefail
          for name in COOLIFY_ENV_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY PAYOUT_ENCRYPTION_KEY PAYOUT_ENCRYPTION_KEY_ID SENTRY_AUTH_TOKEN SOURCE_COMMIT PROJECT_REF; do
            test -n "${!name}" || { echo "::error::Missing required deployment configuration: ${name}"; exit 1; }
          done

          # Supabase Vault remains the source of truth for the pg_cron bearer
          # secret. Capture the read-only query output without writing it to
          # the Actions log, mask it immediately, and pass it directly to
          # Coolify's encrypted environment store.
          cron_query_output="$(supabase db query \
            --remote="$PROJECT_REF" \
            --read-only \
            --agent no \
            --output-format json \
            "select secret as cron_secret from vault.decrypted_secrets where name = 'ops_alert_cron_secret' limit 1")"
          CRON_SECRET="$(printf '%s' "$cron_query_output" \
            | jq -er '.. | objects | select(.cron_secret? != null) | .cron_secret' \
            | sed -n '1p')"
          test -n "$CRON_SECRET" || { echo "::error::Supabase Vault did not return the Ticketiv cron secret"; exit 1; }
          echo "::add-mask::$CRON_SECRET"
          unset cron_query_output

          # Read the active public DSN from Sentry rather than duplicating it
          # as another repository secret. The API token is never copied into
          # the response body or printed.
          sentry_keys="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            --header "Accept: application/json" \
            "https://sentry.io/api/0/projects/eljaymedia-5k/ticketiv/keys/")"
          SENTRY_DSN="$(printf '%s' "$sentry_keys" \
            | jq -er '[.[] | select(.isActive == true and (.dsn.public | type == "string")) | .dsn.public][0]')"
          test -n "$SENTRY_DSN" || { echo "::error::Sentry did not return an active Ticketiv DSN"; exit 1; }
          echo "::add-mask::$SENTRY_DSN"
          unset sentry_keys

          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg publishable "$SUPABASE_PUBLISHABLE_KEY" \
            --arg service_role "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg payout_key "$PAYOUT_ENCRYPTION_KEY" \
            --arg payout_key_id "$PAYOUT_ENCRYPTION_KEY_ID" \
            --arg cron_secret "$CRON_SECRET" \
            --arg sentry_dsn "$SENTRY_DSN" \
            --arg sentry_token "$SENTRY_AUTH_TOKEN" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg node_options "--max-old-space-size=4096" \
            '{data: [
              {key:"SUPABASE_URL", value:$url, is_runtime:true, is_buildtime:false, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_URL", value:$url, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY", value:$publishable, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_ANON_KEY", value:$publishable, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"SUPABASE_SERVICE_ROLE_KEY", value:$service_role, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"PAYOUT_ENCRYPTION_KEY", value:$payout_key, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"PAYOUT_ENCRYPTION_KEY_ID", value:$payout_key_id, is_runtime:true, is_buildtime:false, is_shown_once:false},
              {key:"CRON_SECRET", value:$cron_secret, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"SENTRY_DSN", value:$sentry_dsn, is_runtime:true, is_buildtime:true, is_shown_once:true},
              {key:"NEXT_PUBLIC_SENTRY_DSN", value:$sentry_dsn, is_runtime:true, is_buildtime:true, is_shown_once:true},
              {key:"SENTRY_AUTH_TOKEN", value:$sentry_token, is_runtime:false, is_buildtime:true, is_shown_once:true},
              {key:"SENTRY_ORG", value:"eljaymedia-5k", is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"SENTRY_PROJECT", value:"ticketiv", is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"SENTRY_SOURCE_MAPS_BUILD_ENABLED", value:"true", is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NODE_OPTIONS", value:$node_options, is_runtime:false, is_buildtime:true, is_shown_once:false},
              {key:"SOURCE_COMMIT", value:$source_commit, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"DEPLOYMENT_ENV", value:"production", is_runtime:true, is_buildtime:true, is_shown_once:false}
            ]}' \
            | curl --fail-with-body --silent --show-error \
                --retry 3 --retry-all-errors \
                --request PATCH \
                --url "https://coolify.eljaymedia.com/api/v1/applications/zs2jkfesdsmrrftkjgcnoekp/envs/bulk" \
                --header "Authorization: Bearer ${COOLIFY_ENV_TOKEN}" \
                --header "Content-Type: application/json" \
                --data-binary @- \
            > /dev/null

      - name: Queue Ticketiv deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          test -n "$COOLIFY_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --url "https://coolify.eljaymedia.com/api/v1/deploy" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"uuid":"zs2jkfesdsmrrftkjgcnoekp","force":false}'
