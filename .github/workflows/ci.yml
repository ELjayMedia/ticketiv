name: CI

on:
  pull_request:
  push:

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo is pnpm-only (see CLAUDE.md). corepack pins pnpm to the
      # version declared in package.json#packageManager (pnpm@10.28.0).
      - name: Enable corepack (pnpm 10.28.0)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (TICK-174)
        run: pnpm test

      # TICK-175 — type burndown complete (233 → 0). tsc is now blocking and
      # next.config.mjs has ignoreBuildErrors:false, so type regressions fail CI.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Demo-pattern guard (TICK-162)
        run: bash scripts/check-demo-patterns.sh

      - name: Build
        run: pnpm build
