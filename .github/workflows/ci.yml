name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # corepack must be enabled before setup-node so its `cache: pnpm` step can
      # resolve the pnpm store path (otherwise: "Unable to locate executable file: pnpm").
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # check:release includes check:permissions. The invariants over the
      # committed matrix always run; the live drift diff additionally runs when
      # these secrets are configured, which is what catches a grant applied
      # straight to the database without a migration (TICK-337).
      - name: Run release verification
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm check:release

  e2e-smoke:
    name: E2E smoke (browser)
    runs-on: ubuntu-latest
    needs: release-gate
    timeout-minutes: 20
    # Advisory by default. Set the E2E_STRICT repo variable to "1" once
    # UAT fixtures are seeded and branch protection should block on the
    # browser journey.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate E2E runtime configuration
        env:
          E2E_STRICT: ${{ vars.E2E_STRICT || '0' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required E2E configuration: ${name}"
              missing=1
            fi
          done
          if [ "$E2E_STRICT" = "1" ] && [ -z "$E2E_PAYSTACK_TEST_KEY" ]; then
            echo "::error::Strict checkout E2E is enabled but E2E_PAYSTACK_TEST_KEY is not configured."
            missing=1
          fi
          exit "$missing"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Seed UAT fixtures so E2E tests have deterministic data to run against.
      # This makes CI test the actual flow, not production's empty event list.
      - name: Seed UAT fixtures
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
        run: node scripts/seed-uat.mjs

      # Boot a local dev server for deterministic E2E testing.
      # Ticketiv's public Supabase config prefers the modern publishable key and
      # retains the project-safe fallback in lib/env-public.ts during migration.
      - name: Boot test server
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm dev &
          npx wait-on http://localhost:3000

      # E2E tests run against the local dev server with seeded UAT fixtures.
      # CI fails when the actual flow is broken (not because production has no events).
      - name: Run E2E smoke
        continue-on-error: ${{ vars.E2E_STRICT != '1' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_STRICT: ${{ vars.E2E_STRICT || '0' }}
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Record E2E enforcement mode
        if: always()
        run: |
          if [ "${{ vars.E2E_STRICT }}" = "1" ]; then
            echo "E2E_STRICT=1; browser E2E failures block this job."
          else
            echo "E2E_STRICT is not enabled; browser E2E is advisory."
            echo "A Playwright failure is retained in step logs and uploaded artifacts but does not fail this CI job."
          fi
