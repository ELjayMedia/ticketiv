name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # corepack must be enabled before setup-node so its `cache: pnpm` step can
      # resolve the pnpm store path (otherwise: "Unable to locate executable file: pnpm").
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TICK-466: check:crossorg needs an isolated database with Ticketiv's
      # schema. A throwaway local Supabase Postgres, built from
      # supabase/migrations, lives only for this job. It is never the shared
      # project; the harness also rolls back everything it seeds.
      - name: Start isolated verification database
        uses: ./.github/actions/start-isolated-supabase

      - name: Verify public security controls on isolated database
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f supabase/tests/security_public_surface.sql

      # check:release includes check:permissions. The invariants over the
      # committed matrix always run; the live drift diff additionally runs when
      # these secrets are configured, which is what catches a grant applied
      # straight to the database without a migration (TICK-337).
      - name: Run release verification
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKETIV_CROSS_ORG_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm check:release

      - name: Stop isolated verification database
        if: always()
        run: supabase stop --no-backup || true

  change-scope:
    name: CI change scope
    runs-on: ubuntu-latest
    outputs:
      money_path: ${{ steps.scope.outputs.money_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect money-path changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "money_path=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            diff_range="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              diff_range="$before..${{ github.sha }}"
            else
              diff_range="HEAD^..HEAD"
            fi
          else
            echo "money_path=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$diff_range")"
          printf '%s\n' "$files"

          if printf '%s\n' "$files" | grep -Eq '^(lib/payments(\.ts|/)|lib/orders(\.ts|/)|e2e/discovery-to-checkout\.spec\.ts$|tests/money-path-lifecycle\.test\.ts$|supabase/migrations/.*(payment|paystack|provider|checkout|order|ledger).*)'; then
            echo "money_path=true" >> "$GITHUB_OUTPUT"
          else
            echo "money_path=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-smoke:
    name: E2E smoke (browser)
    runs-on: ubuntu-latest
    needs: [release-gate, change-scope]
    timeout-minutes: 25
    # The money-path suite seeds and tears down shared UAT fixtures in the one
    # Supabase project, so runs from different PRs must not overlap: one run's
    # teardown deletes the event another run is checking out. Same group as
    # shared-uat.yml; queue rather than cancel.
    concurrency:
      group: ticketiv-shared-supabase-uat
      cancel-in-progress: false
    # TICK-407: blocking launch gate. The browser must reach the payment-provider
    # boundary and the database lifecycle must prove paid-order/ticket invariants.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record scoped validation
        if: ${{ needs.change-scope.outputs.money_path != 'true' }}
        run: |
          echo "Money-path E2E is not required for this pull request."
          echo "The blocking money-path suite still runs for payment-relevant changes and explicit workflow dispatches."

      - name: Validate E2E runtime configuration
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY E2E_PAYSTACK_TEST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required blocking E2E configuration: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Playwright browser
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed UAT fixtures
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        id: seed
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
        run: pnpm seed:uat

      - name: Boot test server
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: |
          pnpm dev &
          npx wait-on http://localhost:3000

      - name: Run blocking checkout to payment-handoff E2E
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_STRICT: "1"
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: pnpm test:e2e e2e/discovery-to-checkout.spec.ts --project=desktop-chromium --workers=1

      - name: Prove paid order and issued-ticket lifecycle
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          TEST_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_ALLOW_PROJECT_REF: radsfmlsjznqvcpogluo
          E2E_ALLOW_SHARED_UAT: "1"
        run: pnpm exec vitest run tests/money-path-lifecycle.test.ts

      - name: Remove deterministic UAT fixtures
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' && steps.seed.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm seed:uat:teardown

      - name: Upload Playwright failure artifacts
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Record E2E enforcement mode
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' }}
        run: |
          echo "Blocking money-path gate enabled."
          echo "Browser: event → checkout → Paystack initialization boundary."
          echo "Database: completion → one succeeded payment → paid order → issued ticket → balanced/idempotent settlement."
          echo "Provider-delivered webhook proof remains separate UAT evidence and is not implied by this CI pass."

  build-image:
    # TICK-474: build the production image on a GitHub-hosted ARM64 runner and
    # publish it to GHCR, so Coolify can pull it instead of compiling on the
    # Oracle VM. Runs only after the release gate and browser smoke pass, once
    # per commit. Until the Coolify cutover this job is additive: production
    # still deploys through deploy-coolify below.
    name: Build production image (ARM64 → GHCR)
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: [release-gate, change-scope, e2e-smoke]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: ticketiv-image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    env:
      IMAGE_REPO: ghcr.io/eljaymedia/ticketiv
      CACHE_REF: ghcr.io/eljaymedia/ticketiv:buildcache-arm64
    steps:
      - name: Resolve immutable image reference
        id: ref
        run: echo "image=${IMAGE_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this commit is already published
        id: exists
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE} already exists; not rebuilding." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build secrets
        if: steps.exists.outputs.found != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SENTRY_AUTH_TOKEN; do
            test -n "${!name}" || { echo "::error::Missing required build configuration: ${name}"; exit 1; }
          done
          sentry_keys="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            --header "Accept: application/json" \
            "https://sentry.io/api/0/projects/eljaymedia-5k/ticketiv/keys/")"
          SENTRY_DSN="$(printf '%s' "$sentry_keys" \
            | jq -er '[.[] | select(.isActive == true and (.dsn.public | type == "string")) | .dsn.public][0]')"
          echo "::add-mask::$SENTRY_DSN"
          unset sentry_keys

          # Same build-time set Coolify mounts today (TICK-474 parity). Every
          # value is passed as a BuildKit secret mounted into the build RUN
          # only, so none of them can reach image layers, ARG/ENV metadata or
          # provenance.
          dir="${RUNNER_TEMP}/build-secrets"
          install -d -m 700 "$dir"
          put() { printf '%s' "$2" > "${dir}/$1"; chmod 600 "${dir}/$1"; }
          put NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
          put NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
          put NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_PUBLISHABLE_KEY"
          put NEXT_PUBLIC_APP_URL "https://ticketiv.app"
          put NEXT_PUBLIC_SENTRY_DSN "$SENTRY_DSN"
          put SENTRY_DSN "$SENTRY_DSN"
          put SENTRY_AUTH_TOKEN "$SENTRY_AUTH_TOKEN"
          put SENTRY_ORG "eljaymedia-5k"
          put SENTRY_PROJECT "ticketiv"
          put SENTRY_SOURCE_MAPS_BUILD_ENABLED "true"
          put NODE_OPTIONS "--max-old-space-size=4096"
          put SOURCE_COMMIT "$GITHUB_SHA"
          put DEPLOYMENT_ENV "production"

          {
            echo "files<<SECRET_FILES_EOF"
            for f in "$dir"/*; do echo "$(basename "$f")=$f"; done
            echo "SECRET_FILES_EOF"
          } >> "$GITHUB_ENV"

          # Mount those secrets as environment variables for the build RUN,
          # exactly as Coolify's BuildKit-secrets mode does. The repository
          # Dockerfile stays unchanged so Coolify's own build keeps working
          # until cutover.
          mounts=""
          for f in "$dir"/*; do k="$(basename "$f")"; mounts="${mounts}--mount=type=secret,id=${k},env=${k} "; done
          awk -v m="$mounts" 'BEGIN{n=0} /^RUN for v in / && n==0 {sub(/^RUN /, "RUN " m); n=1} {print} END{if(n!=1) exit 3}' \
            Dockerfile > "${RUNNER_TEMP}/Dockerfile.ci"

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'

      - name: Build and push linux/arm64 image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.ci
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            DEPLOYMENT_ENV=production
          secret-files: ${{ env.files }}
          # Registry cache keeps the shared 10 GB Actions cache free for the
          # Android and CI caches.
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Verify no build secret reached the image
        if: steps.exists.outputs.found != 'true'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE" > /dev/null
          meta="$(docker image inspect "$IMAGE"; docker history --no-trunc "$IMAGE")"
          token="$(cat "${RUNNER_TEMP}/build-secrets/SENTRY_AUTH_TOKEN")"
          if printf '%s' "$meta" | grep -qF -- "$token"; then
            echo "::error::Sentry auth token found in image metadata"; exit 1
          fi
          cid="$(docker create "$IMAGE")"
          if docker export "$cid" | grep -aqF -- "$token"; then
            docker rm "$cid" > /dev/null
            echo "::error::Sentry auth token found in image filesystem"; exit 1
          fi
          docker rm "$cid" > /dev/null
          echo "Published \`${IMAGE}\` (secrets verified absent)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove build secrets
        if: always()
        run: rm -rf "${RUNNER_TEMP}/build-secrets" "${RUNNER_TEMP}/Dockerfile.ci"

      - name: Keep the 20 most recent commit images
        if: steps.exists.outputs.found != 'true' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ticketiv
          package-type: container
          min-versions-to-keep: 20
          ignore-versions: '^buildcache'

  deploy-coolify:
    name: Deploy production to Coolify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [release-gate, change-scope, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Synchronize Ticketiv Supabase environment
        env:
          COOLIFY_ENV_TOKEN: ${{ secrets.COOLIFY_ENV_TOKEN }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY }}
          PAYOUT_ENCRYPTION_KEY_ID: ${{ vars.PAYOUT_ENCRYPTION_KEY_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          PROJECT_REF: radsfmlsjznqvcpogluo
        run: |
          set -euo pipefail
          for name in COOLIFY_ENV_TOKEN CLOUDFLARE_ACCESS_CLIENT_ID CLOUDFLARE_ACCESS_CLIENT_SECRET SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY PAYOUT_ENCRYPTION_KEY PAYOUT_ENCRYPTION_KEY_ID SENTRY_AUTH_TOKEN SOURCE_COMMIT PROJECT_REF; do
            test -n "${!name}" || { echo "::error::Missing required deployment configuration: ${name}"; exit 1; }
          done

          # The Coolify control plane is protected by Cloudflare Access. A
          # Coolify bearer token alone is intentionally insufficient. These
          # headers authenticate this workflow as the dedicated CI service
          # identity, and redirect following is disabled so an Access login
          # page can never be mistaken for a successful API response.
          coolify_access_headers=(
            --header "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}"
            --header "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          )

          # Supabase Vault remains the source of truth for the pg_cron bearer
          # secret. Capture the read-only query output without writing it to
          # the Actions log, mask it immediately, and pass it directly to
          # Coolify's encrypted environment store.
          cron_query_output="$(supabase db query \
            --remote="$PROJECT_REF" \
            --read-only \
            --agent no \
            --output-format json \
            "select secret as cron_secret from vault.decrypted_secrets where name = 'ops_alert_cron_secret' limit 1")"
          CRON_SECRET="$(printf '%s' "$cron_query_output" \
            | jq -er '.. | objects | select(.cron_secret? != null) | .cron_secret' \
            | sed -n '1p')"
          test -n "$CRON_SECRET" || { echo "::error::Supabase Vault did not return the Ticketiv cron secret"; exit 1; }
          echo "::add-mask::$CRON_SECRET"
          unset cron_query_output

          # Read the active public DSN from Sentry rather than duplicating it
          # as another repository secret. The API token is never copied into
          # the response body or printed.
          sentry_keys="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            --header "Accept: application/json" \
            "https://sentry.io/api/0/projects/eljaymedia-5k/ticketiv/keys/")"
          SENTRY_DSN="$(printf '%s' "$sentry_keys" \
            | jq -er '[.[] | select(.isActive == true and (.dsn.public | type == "string")) | .dsn.public][0]')"
          test -n "$SENTRY_DSN" || { echo "::error::Sentry did not return an active Ticketiv DSN"; exit 1; }
          echo "::add-mask::$SENTRY_DSN"
          unset sentry_keys

          # Build-time values, especially the Sentry upload token, must reach
          # Docker through ephemeral BuildKit secret mounts. Coolify's normal
          # build-argument mode can persist values in image provenance.
          curl --fail-with-body --silent --show-error --location --max-redirs 0 \
            --retry 3 --retry-all-errors \
            --request PATCH \
            --url "https://coolify.eljaymedia.com/api/v1/applications/zs2jkfesdsmrrftkjgcnoekp" \
            "${coolify_access_headers[@]}" \
            --header "Authorization: Bearer ${COOLIFY_ENV_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary '{"use_build_secrets":true}' \
            > /dev/null

          # The Coolify API has previously accepted this update without
          # persisting it. Read the application back and stop before queuing a
          # deployment unless BuildKit secret mounts are observably enabled.
          coolify_application="$(curl --fail --silent --show-error --location --max-redirs 0 \
            --retry 3 --retry-all-errors \
            --url "https://coolify.eljaymedia.com/api/v1/applications/zs2jkfesdsmrrftkjgcnoekp" \
            "${coolify_access_headers[@]}" \
            --header "Authorization: Bearer ${COOLIFY_ENV_TOKEN}" \
            --header "Accept: application/json")"
          printf '%s' "$coolify_application" \
            | jq -e '.settings.use_build_secrets == true' \
            > /dev/null \
            || { echo "::error::Coolify BuildKit secrets are not enabled; refusing to deploy"; exit 1; }
          unset coolify_application

          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg publishable "$SUPABASE_PUBLISHABLE_KEY" \
            --arg service_role "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg payout_key "$PAYOUT_ENCRYPTION_KEY" \
            --arg payout_key_id "$PAYOUT_ENCRYPTION_KEY_ID" \
            --arg cron_secret "$CRON_SECRET" \
            --arg sentry_dsn "$SENTRY_DSN" \
            --arg sentry_token "$SENTRY_AUTH_TOKEN" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg node_options "--max-old-space-size=4096" \
            '{data: [
              {key:"SUPABASE_URL", value:$url, is_runtime:true, is_buildtime:false, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_URL", value:$url, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY", value:$publishable, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_ANON_KEY", value:$publishable, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"SUPABASE_SERVICE_ROLE_KEY", value:$service_role, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"PAYOUT_ENCRYPTION_KEY", value:$payout_key, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"PAYOUT_ENCRYPTION_KEY_ID", value:$payout_key_id, is_runtime:true, is_buildtime:false, is_shown_once:false},
              {key:"CRON_SECRET", value:$cron_secret, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"SENTRY_DSN", value:$sentry_dsn, is_runtime:true, is_buildtime:true, is_shown_once:true},
              {key:"NEXT_PUBLIC_SENTRY_DSN", value:$sentry_dsn, is_runtime:true, is_buildtime:true, is_shown_once:true},
              {key:"SENTRY_AUTH_TOKEN", value:$sentry_token, is_runtime:false, is_buildtime:true, is_shown_once:true},
              {key:"SENTRY_ORG", value:"eljaymedia-5k", is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"SENTRY_PROJECT", value:"ticketiv", is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"SENTRY_SOURCE_MAPS_BUILD_ENABLED", value:"true", is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NODE_OPTIONS", value:$node_options, is_runtime:false, is_buildtime:true, is_shown_once:false},
              {key:"SOURCE_COMMIT", value:$source_commit, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"DEPLOYMENT_ENV", value:"production", is_runtime:true, is_buildtime:true, is_shown_once:false}
            ]}' \
            | curl --fail-with-body --silent --show-error --location --max-redirs 0 \
                --retry 3 --retry-all-errors \
                --request PATCH \
                --url "https://coolify.eljaymedia.com/api/v1/applications/zs2jkfesdsmrrftkjgcnoekp/envs/bulk" \
                "${coolify_access_headers[@]}" \
                --header "Authorization: Bearer ${COOLIFY_ENV_TOKEN}" \
                --header "Content-Type: application/json" \
                --data-binary @- \
            > /dev/null

      - name: Queue Ticketiv deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in COOLIFY_TOKEN CLOUDFLARE_ACCESS_CLIENT_ID CLOUDFLARE_ACCESS_CLIENT_SECRET; do
            test -n "${!name}" || { echo "::error::Missing required deployment configuration: ${name}"; exit 1; }
          done
          curl --fail-with-body --silent --show-error --location --max-redirs 0 \
            --retry 3 --retry-all-errors \
            --request POST \
            --url "https://coolify.eljaymedia.com/api/v1/deploy" \
            --header "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"uuid":"zs2jkfesdsmrrftkjgcnoekp","force":false}'
