name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # corepack must be enabled before setup-node so its `cache: pnpm` step can
      # resolve the pnpm store path (otherwise: "Unable to locate executable file: pnpm").
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # check:release includes check:permissions. The invariants over the
      # committed matrix always run; the live drift diff additionally runs when
      # these secrets are configured, which is what catches a grant applied
      # straight to the database without a migration (TICK-337).
      - name: Run release verification
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm check:release

  change-scope:
    name: CI change scope
    runs-on: ubuntu-latest
    outputs:
      money_path: ${{ steps.scope.outputs.money_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect money-path changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "money_path=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            diff_range="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              diff_range="$before..${{ github.sha }}"
            else
              diff_range="HEAD^..HEAD"
            fi
          else
            echo "money_path=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$diff_range")"
          printf '%s\n' "$files"

          if printf '%s\n' "$files" | grep -Eq '^(lib/payments(\.ts|/)|lib/orders(\.ts|/)|e2e/discovery-to-checkout\.spec\.ts$|tests/money-path-lifecycle\.test\.ts$|supabase/migrations/.*(payment|paystack|provider|checkout|order|ledger).*)'; then
            echo "money_path=true" >> "$GITHUB_OUTPUT"
          else
            echo "money_path=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-smoke:
    name: E2E smoke (browser)
    runs-on: ubuntu-latest
    needs: [release-gate, change-scope]
    timeout-minutes: 25
    # TICK-407: blocking launch gate. The browser must reach the payment-provider
    # boundary and the database lifecycle must prove paid-order/ticket invariants.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record scoped validation
        if: ${{ needs.change-scope.outputs.money_path != 'true' }}
        run: |
          echo "Money-path E2E is not required for this pull request."
          echo "The blocking money-path suite still runs for payment-relevant changes and explicit workflow dispatches."

      - name: Validate E2E runtime configuration
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY E2E_PAYSTACK_TEST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required blocking E2E configuration: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Playwright browser
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed UAT fixtures
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        id: seed
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
        run: pnpm seed:uat

      - name: Boot test server
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: |
          pnpm dev &
          npx wait-on http://localhost:3000

      - name: Run blocking checkout to payment-handoff E2E
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_STRICT: "1"
          E2E_TEST_EVENT_SLUG: uat-public-discovery-event
          E2E_TEST_BUYER_EMAIL: e2e-buyer@example.com
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: pnpm test:e2e e2e/discovery-to-checkout.spec.ts --project=desktop-chromium --workers=1

      - name: Prove paid order and issued-ticket lifecycle
        if: ${{ needs.change-scope.outputs.money_path == 'true' }}
        env:
          TEST_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_ALLOW_PROJECT_REF: radsfmlsjznqvcpogluo
          E2E_ALLOW_SHARED_UAT: "1"
        run: pnpm exec vitest run tests/money-path-lifecycle.test.ts

      - name: Remove deterministic UAT fixtures
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' && steps.seed.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm seed:uat:teardown

      - name: Upload Playwright failure artifacts
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Record E2E enforcement mode
        if: ${{ always() && needs.change-scope.outputs.money_path == 'true' }}
        run: |
          echo "Blocking money-path gate enabled."
          echo "Browser: event → checkout → Paystack initialization boundary."
          echo "Database: completion → one succeeded payment → paid order → issued ticket → balanced/idempotent settlement."
          echo "Provider-delivered webhook proof remains separate UAT evidence and is not implied by this CI pass."
