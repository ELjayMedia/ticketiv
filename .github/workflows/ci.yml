name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # corepack must be enabled before setup-node so its `cache: pnpm` step can
      # resolve the pnpm store path (otherwise: "Unable to locate executable file: pnpm").
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # check:release includes check:permissions. The invariants over the
      # committed matrix always run; the live drift diff additionally runs when
      # these secrets are configured, which is what catches a grant applied
      # straight to the database without a migration (TICK-337).
      - name: Run release verification
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm check:release

  e2e-smoke:
    name: E2E smoke (browser)
    runs-on: ubuntu-latest
    needs: release-gate
    timeout-minutes: 20
    # Advisory by default. Set the E2E_STRICT repo variable to "1" once
    # PLAYWRIGHT_BASE_URL points at seeded staging and branch protection should
    # block on the browser journey.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Public-leg journeys (discover -> event detail) run against the target URL
      # on every PR. Set the PLAYWRIGHT_BASE_URL repo variable to the PR preview
      # or a seeded staging URL to gate the PR's own build; it defaults to
      # production as a public-surface smoke. The authenticated checkout ->
      # ticket -> scan and cross-org legs self-skip until the seeded staging
      # secrets (E2E_TEST_EVENT_SLUG, E2E_TEST_BUYER_EMAIL,
      # E2E_PAYSTACK_TEST_KEY) are configured — see e2e/discovery-to-checkout.spec.ts.
      - name: Run E2E smoke
        continue-on-error: ${{ vars.E2E_STRICT != '1' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://ticketiv.app' }}
          E2E_STRICT: ${{ vars.E2E_STRICT || '0' }}
          E2E_TEST_EVENT_SLUG: ${{ secrets.E2E_TEST_EVENT_SLUG }}
          E2E_TEST_BUYER_EMAIL: ${{ secrets.E2E_TEST_BUYER_EMAIL }}
          E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Record E2E enforcement mode
        if: always()
        run: |
          if [ "${{ vars.E2E_STRICT }}" = "1" ]; then
            echo "E2E_STRICT=1; browser E2E failures block this job."
          else
            echo "E2E_STRICT is not enabled; browser E2E is advisory."
            echo "A Playwright failure is retained in step logs and uploaded artifacts but does not fail this CI job."
          fi
