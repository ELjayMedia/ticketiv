name: Ops alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger production ops alert checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call secured cron endpoint
        env:
          OPS_ALERT_CRON_URL: ${{ secrets.OPS_ALERT_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$OPS_ALERT_CRON_URL" ]; then
            echo "OPS_ALERT_CRON_URL secret is required" >&2
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --retry-delay 5 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$OPS_ALERT_CRON_URL"
