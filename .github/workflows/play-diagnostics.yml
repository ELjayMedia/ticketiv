name: Play Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Play Console state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Play service account secret
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "Missing required secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi

      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Query internal-testing track state
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          {
            echo '### Play Console diagnostic'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in com.ticketiv.app com.ticketiv.access; do
            echo "=== $pkg ==="
            edit_response="$(curl -sS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits")"
            edit_id="$(echo "$edit_response" | jq -r '.id // empty')"

            if [[ -z "$edit_id" ]]; then
              echo "Failed to open an edit for $pkg:"
              echo "$edit_response"
              {
                echo "#### $pkg"
                echo '```'
                echo "$edit_response"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "edit id: $edit_id"

            echo "--- internal track ---"
            track_response="$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits/$edit_id/tracks/internal")"
            echo "$track_response" | jq .

            echo "--- bundles on this edit (reflects last committed state) ---"
            bundles_response="$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits/$edit_id/bundles")"
            echo "$bundles_response" | jq .

            {
              echo "#### $pkg"
              echo "- Edit ID: \`$edit_id\`"
              echo '- Internal track:'
              echo '```json'
              echo "$track_response" | jq .
              echo '```'
              echo '- Bundles:'
              echo '```json'
              echo "$bundles_response" | jq .
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits/$edit_id" >/dev/null || true
          done
