name: Play Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Play Console state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Play service account secret
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "Missing required secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi

      - name: Authenticate to Google (JWT bearer, no extra API needed)
        id: auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          client_email="$(printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -r '.client_email')"
          private_key="$(printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -r '.private_key')"

          now="$(date +%s)"
          exp="$((now + 3600))"

          header='{"alg":"RS256","typ":"JWT"}'
          claims="$(jq -nc --arg iss "$client_email" \
            --arg scope "https://www.googleapis.com/auth/androidpublisher" \
            --arg aud "https://oauth2.googleapis.com/token" \
            --argjson iat "$now" --argjson exp "$exp" \
            '{iss:$iss, scope:$scope, aud:$aud, iat:$iat, exp:$exp}')"

          header_b64="$(printf '%s' "$header" | b64url)"
          claims_b64="$(printf '%s' "$claims" | b64url)"
          signing_input="${header_b64}.${claims_b64}"

          signature="$(printf '%s' "$signing_input" | openssl dgst -sha256 -sign <(printf '%s' "$private_key") | b64url)"
          jwt="${signing_input}.${signature}"

          token_response="$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            -d "assertion=$jwt")"
          access_token="$(printf '%s' "$token_response" | jq -r '.access_token // empty')"

          if [[ -z "$access_token" ]]; then
            echo "Failed to obtain access token:" >&2
            echo "$token_response" >&2
            exit 1
          fi

          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Query internal-testing track state
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          {
            echo '### Play Console diagnostic'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in com.ticketiv.app com.ticketiv.access; do
            echo "=== $pkg ==="
            edit_response="$(curl -sS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits")"
            edit_id="$(echo "$edit_response" | jq -r '.id // empty')"

            if [[ -z "$edit_id" ]]; then
              echo "Failed to open an edit for $pkg:"
              echo "$edit_response"
              {
                echo "#### $pkg"
                echo '```'
                echo "$edit_response"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "edit id: $edit_id"

            echo "--- internal track ---"
            track_response="$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits/$edit_id/tracks/internal")"
            echo "$track_response" | jq .

            echo "--- bundles on this edit (reflects last committed state) ---"
            bundles_response="$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits/$edit_id/bundles")"
            echo "$bundles_response" | jq .

            {
              echo "#### $pkg"
              echo "- Edit ID: \`$edit_id\`"
              echo '- Internal track:'
              echo '```json'
              echo "$track_response" | jq .
              echo '```'
              echo '- Bundles:'
              echo '```json'
              echo "$bundles_response" | jq .
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$pkg/edits/$edit_id" >/dev/null || true
          done
