name: Migrate secrets into restricted environments
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    if: github.ref == 'refs/heads/uat' && github.actor == 'ELjayMedia'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      COOLIFY_ENV_TOKEN: ${{ secrets.COOLIFY_ENV_TOKEN }}
      E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
      E2E_TEST_BUYER_EMAIL: ${{ secrets.E2E_TEST_BUYER_EMAIL }}
      E2E_TEST_EVENT_SLUG: ${{ secrets.E2E_TEST_EVENT_SLUG }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TICKETIV_ACCESS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TICKETIV_ACCESS_UPLOAD_KEYSTORE_BASE64 }}
      TICKETIV_ACCESS_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_ACCESS_UPLOAD_KEY_ALIAS }}
      TICKETIV_ACCESS_UPLOAD_KEY_PASSWORD: ${{ secrets.TICKETIV_ACCESS_UPLOAD_KEY_PASSWORD }}
      TICKETIV_ACCESS_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_ACCESS_UPLOAD_STORE_PASSWORD }}
      TICKETIV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TICKETIV_UPLOAD_KEYSTORE_BASE64 }}
      TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
      TICKETIV_UPLOAD_KEY_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_KEY_PASSWORD }}
      TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
    steps:
      - name: Seal credentials to destination environment public keys
        env:
          DESTINATION_KEYS: '[{"environment":"UAT","key_id":"3380204578043523366","key":"FtoR2j6FNFSMb3DZGW40fejee2elXvC8l9hS22Ylqlg="},{"environment":"Production","key_id":"3380204578043523366","key":"+OE7Udr4ckh/A86Uj8ZxREIM3d4s7+a3ox0bzu5SB0Q="},{"environment":"google-play-production","key_id":"3380204578043523366","key":"juIIawS465hmGb06VdZ7ldNhOMHovu2X+ir+hSDQ0V4="}]'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,ctypes,ctypes.util,pathlib
          sodium=ctypes.CDLL(ctypes.util.find_library('sodium'))
          assert sodium.sodium_init()>=0
          output=[]
          for target in json.loads(os.environ['DESTINATION_KEYS']):
            for name in ["CLOUDFLARE_ACCESS_CLIENT_ID","CLOUDFLARE_ACCESS_CLIENT_SECRET","COOLIFY_DEPLOY_TOKEN","COOLIFY_ENV_TOKEN","E2E_PAYSTACK_TEST_KEY","E2E_TEST_BUYER_EMAIL","E2E_TEST_EVENT_SLUG","GOOGLE_PLAY_SERVICE_ACCOUNT_JSON","PAYOUT_ENCRYPTION_KEY","SENTRY_AUTH_TOKEN","SUPABASE_ACCESS_TOKEN","SUPABASE_PUBLISHABLE_KEY","SUPABASE_SERVICE_ROLE_KEY","SUPABASE_URL","TEST_SUPABASE_SERVICE_ROLE_KEY","TICKETIV_ACCESS_UPLOAD_KEYSTORE_BASE64","TICKETIV_ACCESS_UPLOAD_KEY_ALIAS","TICKETIV_ACCESS_UPLOAD_KEY_PASSWORD","TICKETIV_ACCESS_UPLOAD_STORE_PASSWORD","TICKETIV_UPLOAD_KEYSTORE_BASE64","TICKETIV_UPLOAD_KEY_ALIAS","TICKETIV_UPLOAD_KEY_PASSWORD","TICKETIV_UPLOAD_STORE_PASSWORD"]:
              if target['environment']=='UAT' and name!='E2E_PAYSTACK_TEST_KEY': continue
              if target['environment']=='google-play-production' and not (name.startswith('TICKETIV_') or name in ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON','SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_SERVICE_ROLE_KEY']): continue
              value=os.environ.get(name,'')
              if not value: raise RuntimeError('Required source secret missing: '+name)
              raw=value.encode()
              sealed=ctypes.create_string_buffer(len(raw)+48)
              public=base64.b64decode(target['key'])
              assert len(public)==32
              sodium.crypto_box_seal.argtypes=[ctypes.c_void_p,ctypes.c_void_p,ctypes.c_ulonglong,ctypes.c_void_p]
              assert sodium.crypto_box_seal(sealed,raw,len(raw),public)==0
              output.append({'environment':target['environment'],'name':name,'key_id':target['key_id'],'encrypted_value':base64.b64encode(sealed.raw).decode()})
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'encrypted-environment-secrets.json'
          path.write_text(json.dumps(output))
          path.chmod(0o600)
          print('Created encrypted destination payloads; no plaintext files were written.')
          PY
      - name: Retain encrypted migration payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-environment-secrets
          path: ${{ runner.temp }}/encrypted-environment-secrets.json
          retention-days: 1
