name: Ticketiv Android

on:
  pull_request:
    paths:
      - "apps/ticketiv/**"
      - "packages/adapters/**"
      - "packages/shared/**"
      - "packages/tokens/**"
      - ".github/workflows/ticketiv-android.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/*play*.mjs"
      - "scripts/tests/play-listings.test.mjs"
      - ".github/workflows/play-*.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_upload_signed_play:
        description: Build the owner-managed, upload-signed Play bundle from main
        required: true
        default: false
        type: boolean
      release_confirmation:
        description: Type UPLOAD_TICKETIV_PLAY to confirm a signed release build
        required: false
        type: string
      publish_to_play_internal:
        description: Also publish the signed AAB to the Play Internal testing track
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.build_upload_signed_play && 'google-play-ticketiv' || format('ticketiv-android-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_upload_signed_play }}

jobs:
  release-bundle:
    name: ${{ matrix.target }} release bundle + APK
    if: github.event_name != 'workflow_dispatch' || !inputs.build_upload_signed_play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - play
          - huawei

    env:
      TICKETIV_ANDROID_VERSION_CODE: ${{ github.run_number }}
      TICKETIV_ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned release AAB
        run: pnpm --filter @ticketiv/app-consumer native:bundle:${{ matrix.target }}

      - name: Upload release bundle contract
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-${{ matrix.target }}-unsigned-${{ github.run_attempt }}
          path: apps/ticketiv/.artifacts/ticketiv-${{ matrix.target }}-release.aab
          if-no-files-found: error
          retention-days: 3

      # AABs are for app stores. Compile an APK as a separate, standalone
      # Android output on PRs and main, without granting access to signing keys.
      - name: Build unsigned release APK
        run: pnpm --filter @ticketiv/app-consumer native:apk:${{ matrix.target }}

      - name: Verify standalone APK bundle
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="apps/ticketiv/android/app/build/outputs/apk/${{ matrix.target }}/release"
          shopt -s nullglob
          apks=("$apk_dir"/*.apk)
          test "${#apks[@]}" -eq 1
          unzip -Z -1 "${apks[0]}" | grep -Fx 'assets/index.android.bundle' > /dev/null
          {
            echo "### Ticketiv ${{ matrix.target }} APK (compile check)"
            echo
            echo "- Unsigned; **not installable**. Use the manually approved signed APK run for device testing."
            echo "- APK SHA-256: \`$(sha256sum "${apks[0]}" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-${{ matrix.target }}-apk-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/ticketiv/android/app/build/outputs/apk/${{ matrix.target }}/release/*.apk
          if-no-files-found: error
          retention-days: 3

  launch-smoke:
    name: Play release cold launch (Android emulator)
    needs: release-bundle
    if: github.event_name != 'workflow_dispatch' || !inputs.build_upload_signed_play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download exact unsigned Play release APK
        uses: actions/download-artifact@v4
        with:
          name: ticketiv-play-apk-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ticketiv-unsigned

      # Release builds in PRs have no signing secrets. Sign the APK only to
      # allow the emulator to install the exact bundle compiled above.
      # This disposable test key is unrelated to the Play upload certificate.
      - name: Sign emulator-only APK with ephemeral test key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 1 \\
            -storetype PKCS12 -keystore "$RUNNER_TEMP/ticketiv-smoke.p12" \\
            -storepass ticketiv-smoke-only -keypass ticketiv-smoke-only \\
            -alias smoke -dname "CN=Ticketiv Smoke Test,O=CI,C=SZ"
          mapfile -t apks < <(find "$RUNNER_TEMP/ticketiv-unsigned" -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not configured}}"
          build_tools="$android_sdk/build-tools/36.0.0"
          "$build_tools/zipalign" -P 16 -f -v 4 "${apks[0]}" "$RUNNER_TEMP/ticketiv-aligned.apk"
          "$build_tools/apksigner" sign \\
            --ks "$RUNNER_TEMP/ticketiv-smoke.p12" --ks-type PKCS12 \\
            --ks-key-alias smoke --ks-pass pass:ticketiv-smoke-only \\
            --key-pass pass:ticketiv-smoke-only \\
            --out "$RUNNER_TEMP/ticketiv-play-smoke.apk" "$RUNNER_TEMP/ticketiv-aligned.apk"
          "$build_tools/apksigner" verify "$RUNNER_TEMP/ticketiv-play-smoke.apk"

      - name: Allow Android emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Launch release APK and verify rendered UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-launch-smoke.sh "$RUNNER_TEMP/ticketiv-play-smoke.apk"

      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-android-launch-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ticketiv-android-smoke.log
            ${{ runner.temp }}/ticketiv-android-window.xml
          if-no-files-found: ignore
          retention-days: 7

  upload-signed-play-bundle:
    name: upload-signed Play bundle
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.build_upload_signed_play &&
      inputs.release_confirmation == 'UPLOAD_TICKETIV_PLAY'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TICKETIV_ANDROID_VERSION_CODE: ${{ github.run_number }}
      TICKETIV_ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout dispatched main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Require complete upload-signing secrets
        shell: bash
        env:
          TICKETIV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TICKETIV_UPLOAD_KEYSTORE_BASE64 }}
          TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
          TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
          TICKETIV_UPLOAD_KEY_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            TICKETIV_UPLOAD_KEYSTORE_BASE64 \
            TICKETIV_UPLOAD_STORE_PASSWORD \
            TICKETIV_UPLOAD_KEY_ALIAS \
            TICKETIV_UPLOAD_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required android-release secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Materialize upload keystore
        id: keystore
        shell: bash
        env:
          TICKETIV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TICKETIV_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/ticketiv-upload.keystore"
          install -m 600 /dev/null "$keystore_path"
          printf '%s' "$TICKETIV_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "TICKETIV_UPLOAD_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # check:crossorg inside check:release exits non-zero without this database.
      - name: Start isolated verification database
        uses: ./.github/actions/start-isolated-supabase

      - name: Run exact-commit release verification
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKETIV_CROSS_ORG_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm check:release

      # Free the database's memory before the Gradle build.
      - name: Stop isolated verification database
        if: always()
        shell: bash
        run: supabase stop --no-backup || true

      - name: Build upload-signed Play AAB
        env:
          TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
          TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
          TICKETIV_UPLOAD_KEY_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_KEY_PASSWORD }}
        run: pnpm --filter @ticketiv/app-consumer native:bundle:play

      - name: Verify signature and publish certificate fingerprint
        id: signature
        shell: bash
        env:
          TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
          TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          source_aab="apps/ticketiv/.artifacts/ticketiv-play-release.aab"
          signed_aab="apps/ticketiv/.artifacts/ticketiv-play-upload-signed.aab"
          verification_log="$RUNNER_TEMP/ticketiv-jarsigner-verification.txt"

          jarsigner -verify -verbose -certs "$source_aab" > "$verification_log"
          grep -q '^jar verified\.$' "$verification_log"

          bundle_fingerprint="$(keytool -printcert -jarfile "$source_aab" | awk -F': ' '/SHA256:/{print $2; exit}')"
          upload_fingerprint="$(keytool -list -v \
            -keystore "$TICKETIV_UPLOAD_STORE_FILE" \
            -alias "$TICKETIV_UPLOAD_KEY_ALIAS" \
            -storepass:env TICKETIV_UPLOAD_STORE_PASSWORD \
            | awk -F': ' '/SHA256:/{print $2; exit}')"
          test -n "$bundle_fingerprint"
          test "$bundle_fingerprint" = "$upload_fingerprint"
          mv "$source_aab" "$signed_aab"

          echo "certificate_sha256=$bundle_fingerprint" >> "$GITHUB_OUTPUT"
          {
            echo '### Ticketiv Play upload bundle'
            echo
            echo "- Version code: $TICKETIV_ANDROID_VERSION_CODE"
            echo "- Version name: $TICKETIV_ANDROID_VERSION_NAME"
            echo "- Upload certificate SHA-256 (not the Play App Signing certificate for assetlinks.json): \`$bundle_fingerprint\`"
            echo "- AAB SHA-256: \`$(sha256sum "$signed_aab" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-play-upload-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/ticketiv/.artifacts/ticketiv-play-upload-signed.aab
          if-no-files-found: error
          retention-days: 7

      # The upload keystore is only loaded on an explicitly confirmed
      # workflow_dispatch from main. No signing secrets are available to PR jobs.
      - name: Build upload-signed Play APK
        env:
          TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
          TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
          TICKETIV_UPLOAD_KEY_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_KEY_PASSWORD }}
        run: pnpm --filter @ticketiv/app-consumer native:apk:play

      - name: Verify signed APK and embedded JS bundle
        shell: bash
        env:
          EXPECTED_UPLOAD_CERT_SHA256: ${{ steps.signature.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          apk="apps/ticketiv/android/app/build/outputs/apk/play/release/app-play-release.apk"
          test -s "$apk"
          unzip -Z -1 "$apk" | grep -Fx 'assets/index.android.bundle' > /dev/null

          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not configured}}"
          apk_signer="$android_sdk/build-tools/36.0.0/apksigner"
          test -x "$apk_signer"
          verification_log="$RUNNER_TEMP/ticketiv-apk-signature.txt"
          "$apk_signer" verify --verbose --print-certs "$apk" > "$verification_log"

          actual_fingerprint="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' "$verification_log")"
          expected_fingerprint="$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"

          {
            echo "### Ticketiv internal Play APK"
            echo
            echo "- Upload-signature verified (not necessarily the Play App Signing certificate)."
            echo "- APK SHA-256: \`$(sha256sum "$apk" | awk '{print $1}')\`"
            echo "- Installation: download the signed APK artifact from this run and extract the ZIP."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK for internal testing
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-play-internal-signed-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/ticketiv/android/app/build/outputs/apk/play/release/app-play-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Require Play publish secret
        if: inputs.publish_to_play_internal
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "Missing required secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi

      - name: Publish to Play Internal testing
        if: inputs.publish_to_play_internal
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ticketiv.app
          releaseFiles: apps/ticketiv/.artifacts/ticketiv-play-upload-signed.aab
          tracks: internal
          status: completed
          whatsNewDirectory: apps/ticketiv/store-listing/whatsnew

      - name: Record verified internal release receipt
        if: inputs.publish_to_play_internal
        run: >-
          node scripts/create-play-release-receipt.mjs --app ticketiv
          --bundle apps/ticketiv/.artifacts/ticketiv-play-upload-signed.aab
          --output apps/ticketiv/.artifacts/play-release-receipt.json

      - name: Upload internal release receipt
        if: inputs.publish_to_play_internal
        uses: actions/upload-artifact@v4
        with:
          name: play-release-receipt-ticketiv-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ticketiv/.artifacts/play-release-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove upload keystore
        if: always() && steps.keystore.outcome != 'skipped'
        shell: bash
        run: rm -f "$RUNNER_TEMP/ticketiv-upload.keystore"
