name: Ticketiv Android

on:
  pull_request:
    paths:
      - "apps/ticketiv/**"
      - "packages/adapters/**"
      - "packages/shared/**"
      - "packages/tokens/**"
      - ".github/workflows/ticketiv-android.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/ticketiv/**"
      - "packages/adapters/**"
      - "packages/shared/**"
      - "packages/tokens/**"
      - ".github/workflows/ticketiv-android.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      build_upload_signed_play:
        description: Build the owner-managed, upload-signed Play bundle from main
        required: true
        default: false
        type: boolean
      release_confirmation:
        description: Type UPLOAD_TICKETIV_PLAY to confirm a signed release build
        required: false
        type: string
      publish_to_play_internal:
        description: Also publish the signed AAB to the Play Internal testing track
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ticketiv-android-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.build_upload_signed_play && 'upload-signed' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_upload_signed_play }}

jobs:
  release-bundle:
    name: ${{ matrix.target }} release bundle
    if: github.event_name != 'workflow_dispatch' || !inputs.build_upload_signed_play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - play
          - huawei

    env:
      TICKETIV_ANDROID_VERSION_CODE: ${{ github.run_number }}
      TICKETIV_ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned release AAB
        run: pnpm --filter @ticketiv/app-consumer native:bundle:${{ matrix.target }}

      - name: Upload release bundle contract
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-${{ matrix.target }}-unsigned-${{ github.run_attempt }}
          path: apps/ticketiv/.artifacts/ticketiv-${{ matrix.target }}-release.aab
          if-no-files-found: error
          retention-days: 3

  upload-signed-play-bundle:
    name: upload-signed Play bundle
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.build_upload_signed_play &&
      inputs.release_confirmation == 'UPLOAD_TICKETIV_PLAY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TICKETIV_ANDROID_VERSION_CODE: ${{ github.run_number }}
      TICKETIV_ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout dispatched main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Require complete upload-signing secrets
        shell: bash
        env:
          TICKETIV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TICKETIV_UPLOAD_KEYSTORE_BASE64 }}
          TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
          TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
          TICKETIV_UPLOAD_KEY_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            TICKETIV_UPLOAD_KEYSTORE_BASE64 \
            TICKETIV_UPLOAD_STORE_PASSWORD \
            TICKETIV_UPLOAD_KEY_ALIAS \
            TICKETIV_UPLOAD_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required android-release secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Materialize upload keystore
        id: keystore
        shell: bash
        env:
          TICKETIV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TICKETIV_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/ticketiv-upload.keystore"
          install -m 600 /dev/null "$keystore_path"
          printf '%s' "$TICKETIV_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "TICKETIV_UPLOAD_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build upload-signed Play AAB
        env:
          TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
          TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
          TICKETIV_UPLOAD_KEY_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_KEY_PASSWORD }}
        run: pnpm --filter @ticketiv/app-consumer native:bundle:play

      - name: Verify signature and publish certificate fingerprint
        id: signature
        shell: bash
        env:
          TICKETIV_UPLOAD_STORE_PASSWORD: ${{ secrets.TICKETIV_UPLOAD_STORE_PASSWORD }}
          TICKETIV_UPLOAD_KEY_ALIAS: ${{ secrets.TICKETIV_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          source_aab="apps/ticketiv/.artifacts/ticketiv-play-release.aab"
          signed_aab="apps/ticketiv/.artifacts/ticketiv-play-upload-signed.aab"
          verification_log="$RUNNER_TEMP/ticketiv-jarsigner-verification.txt"

          jarsigner -verify -verbose -certs "$source_aab" > "$verification_log"
          grep -q '^jar verified\.$' "$verification_log"

          bundle_fingerprint="$(keytool -printcert -jarfile "$source_aab" | awk -F': ' '/SHA256:/{print $2; exit}')"
          upload_fingerprint="$(keytool -list -v \
            -keystore "$TICKETIV_UPLOAD_STORE_FILE" \
            -alias "$TICKETIV_UPLOAD_KEY_ALIAS" \
            -storepass:env TICKETIV_UPLOAD_STORE_PASSWORD \
            | awk -F': ' '/SHA256:/{print $2; exit}')"
          test -n "$bundle_fingerprint"
          test "$bundle_fingerprint" = "$upload_fingerprint"
          mv "$source_aab" "$signed_aab"

          echo "certificate_sha256=$bundle_fingerprint" >> "$GITHUB_OUTPUT"
          {
            echo '### Ticketiv Play upload bundle'
            echo
            echo "- Version code: $TICKETIV_ANDROID_VERSION_CODE"
            echo "- Version name: $TICKETIV_ANDROID_VERSION_NAME"
            echo "- Upload certificate SHA-256 (not the Play App Signing certificate for assetlinks.json): \`$bundle_fingerprint\`"
            echo "- AAB SHA-256: \`$(sha256sum "$signed_aab" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-play-upload-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/ticketiv/.artifacts/ticketiv-play-upload-signed.aab
          if-no-files-found: error
          retention-days: 7

      - name: Require Play publish secret
        if: inputs.publish_to_play_internal
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "Missing required secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi

      - name: Publish to Play Internal testing
        if: inputs.publish_to_play_internal
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ticketiv.app
          releaseFiles: apps/ticketiv/.artifacts/ticketiv-play-upload-signed.aab
          tracks: internal
          status: completed
          whatsNewDirectory: apps/ticketiv/store-listing/whatsnew

      - name: Remove upload keystore
        if: always() && steps.keystore.outcome != 'skipped'
        shell: bash
        run: rm -f "$RUNNER_TEMP/ticketiv-upload.keystore"
