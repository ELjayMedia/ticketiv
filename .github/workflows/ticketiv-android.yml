name: Ticketiv Android

on:
  pull_request:
    paths:
      - "apps/ticketiv/**"
      - "packages/adapters/**"
      - "packages/shared/**"
      - "packages/tokens/**"
      - ".github/workflows/ticketiv-android.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/ticketiv/**"
      - "packages/adapters/**"
      - "packages/shared/**"
      - "packages/tokens/**"
      - ".github/workflows/ticketiv-android.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: ticketiv-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-bundle:
    name: ${{ matrix.target }} release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - play
          - huawei

    env:
      TICKETIV_ANDROID_VERSION_CODE: ${{ github.run_number }}
      TICKETIV_ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned release AAB
        run: pnpm --filter @ticketiv/app-consumer native:bundle:${{ matrix.target }}

      - name: Upload release bundle contract
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-${{ matrix.target }}-unsigned-${{ github.run_attempt }}
          path: apps/ticketiv/.artifacts/ticketiv-${{ matrix.target }}-release.aab
          if-no-files-found: error
          retention-days: 3
