name: Shared Supabase UAT

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_shared_uat:
        description: Run mutation-backed UAT against ticketiv.app and its shared Supabase project
        required: true
        default: false
        type: boolean
      uat_confirmation:
        description: Type RUN_TICKETIV_SHARED_UAT to confirm temporary synthetic writes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ticketiv-shared-supabase-uat
  cancel-in-progress: false

jobs:
  shared-uat:
    name: database and browser UAT
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.run_shared_uat &&
        inputs.uat_confirmation == 'RUN_TICKETIV_SHARED_UAT'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: https://ticketiv.app
      E2E_STRICT: "1"
      E2E_ALLOW_SHARED_UAT: "1"
      # Prefer dedicated TEST_* secrets when present. Ticketiv currently uses the
      # same allow-listed Supabase project for production and UAT, so falling back
      # to the already-configured CI credentials is intentional and still guarded
      # by TEST_SUPABASE_ALLOW_PROJECT_REF below.
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || secrets.SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_SUPABASE_ALLOW_PROJECT_REF: radsfmlsjznqvcpogluo
      # These are deterministic fixture identifiers, not secrets. Keeping them
      # inline prevents stale repository secrets from targeting a real event.
      E2E_TEST_EVENT_SLUG: uat-public-discovery-event
      # Paystack rejects reserved .invalid addresses before hosted checkout.
      # Use Ticketiv's real domain while keeping this clearly synthetic.
      E2E_TEST_BUYER_EMAIL: uat-checkout@ticketiv.app
      E2E_PAYSTACK_TEST_KEY: ${{ secrets.E2E_PAYSTACK_TEST_KEY }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Record trusted target commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          echo "Shared UAT target: $TARGET_SHA"
          echo "Trigger: $GITHUB_EVENT_NAME"
          {
            echo '### Shared Supabase UAT target'
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Browser target: \`$PLAYWRIGHT_BASE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Wait for the exact commit to reach Coolify production
        id: production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            health="$(curl --fail --silent --show-error --location \
              --retry 2 --retry-all-errors --max-time 30 \
              "${PLAYWRIGHT_BASE_URL}/api/health" || true)"
            revision="$(jq -r '.revision // empty' <<< "$health" 2>/dev/null || true)"
            if [[ "$revision" == "$TARGET_SHA" ]]; then
              echo "Coolify production is healthy on $TARGET_SHA."
              exit 0
            fi

            echo "Waiting for Coolify production to deploy $TARGET_SHA (attempt ${attempt}/80; current=${revision:-unavailable})..."
            sleep 15
          done

          echo "Coolify production did not reach healthy revision $TARGET_SHA within the wait window." >&2
          exit 1

      - name: Prove production alias is reachable
        shell: bash
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 https://ticketiv.app/ > /dev/null

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require the exact shared UAT target
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in TEST_SUPABASE_URL TEST_SUPABASE_SERVICE_ROLE_KEY E2E_TEST_EVENT_SLUG E2E_TEST_BUYER_EMAIL E2E_PAYSTACK_TEST_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required shared-UAT configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          expected_url="https://${TEST_SUPABASE_ALLOW_PROJECT_REF}.supabase.co"
          if [[ "$TEST_SUPABASE_URL" != "$expected_url" ]]; then
            echo "TEST_SUPABASE_URL does not match the allow-listed project ref." >&2
            exit 1
          fi
          test "$PLAYWRIGHT_BASE_URL" = "https://ticketiv.app"

      - name: Install dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed deterministic shared UAT fixtures
        id: seed
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm seed:uat

      - name: Prove database money and scanner lifecycle
        run: pnpm exec vitest run tests/money-path-lifecycle.test.ts

      - name: Run checkout, authenticated and privilege-boundary browser UAT serially
        run: >-
          pnpm test:e2e
          e2e/discovery-to-checkout.spec.ts
          e2e/anonymous-privilege-boundaries.spec.ts
          e2e/authenticated-org-boundaries.spec.ts
          e2e/refunded-ticket-propagation.spec.ts
          e2e/organizer-draft-publish-guard.spec.ts
          e2e/workspace-deletion-safety.spec.ts
          e2e/organizer-onboarding.spec.ts
          --project=desktop-chromium
          --workers=1

      - name: Confirm production stayed on the tested commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 30 \
            "${PLAYWRIGHT_BASE_URL}/api/health")"
          deployed_revision="$(jq -r '.revision // empty' <<< "$health")"
          if [[ "$deployed_revision" != "$TARGET_SHA" ]]; then
            echo "Production changed during UAT: tested $TARGET_SHA but deployed revision is ${deployed_revision:-unknown}." >&2
            echo "This run is intentionally invalid; the newer commit must run its own shared UAT." >&2
            exit 1
          fi

          echo "Production remained on $TARGET_SHA for the full UAT run."

      - name: Remove deterministic shared fixtures
        if: ${{ always() && steps.dependencies.outputs.ready == '1' && env.TEST_SUPABASE_URL != '' && env.TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm seed:uat:teardown

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-uat-playwright-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
