name: Shared Supabase UAT

on:
  workflow_run:
    workflows:
      - Release Gate
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_shared_uat:
        description: Run mutation-backed UAT against ticketiv.app and its shared Supabase project
        required: true
        default: false
        type: boolean
      uat_confirmation:
        description: Type RUN_TICKETIV_SHARED_UAT to confirm temporary synthetic writes
        required: false
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: ticketiv-shared-supabase-uat
  cancel-in-progress: false

jobs:
  shared-uat:
    name: database and browser UAT
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.run_shared_uat &&
        inputs.uat_confirmation == 'RUN_TICKETIV_SHARED_UAT'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: https://ticketiv.app
      E2E_STRICT: "1"
      E2E_ALLOW_SHARED_UAT: "1"
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_SUPABASE_ALLOW_PROJECT_REF: radsfmlsjznqvcpogluo
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Record trusted target commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          echo "Shared UAT target: $TARGET_SHA"
          echo "Trigger: $GITHUB_EVENT_NAME"
          {
            echo '### Shared Supabase UAT target'
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Browser target: \`$PLAYWRIGHT_BASE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Wait for the exact commit to reach Vercel Production
        id: production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          for attempt in $(seq 1 80); do
            deployments="$(curl --fail --silent --show-error "${auth[@]}" \
              "${api}/deployments?sha=${TARGET_SHA}&environment=Production&per_page=20")"

            while IFS= read -r deployment_id; do
              [[ -n "$deployment_id" ]] || continue
              state="$(curl --fail --silent --show-error "${auth[@]}" \
                "${api}/deployments/${deployment_id}/statuses?per_page=20" \
                | jq -r '.[0].state // empty')"

              if [[ "$state" == "success" ]]; then
                echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                echo "Vercel Production deployment $deployment_id is successful for $TARGET_SHA."
                exit 0
              fi
            done < <(jq -r '.[] | select(.creator.login == "vercel[bot]") | .id' <<< "$deployments")

            echo "Waiting for Vercel Production to deploy $TARGET_SHA (attempt ${attempt}/80)..."
            sleep 15
          done

          echo "No successful Vercel Production deployment found for $TARGET_SHA within the wait window." >&2
          exit 1

      - name: Prove production alias is reachable
        shell: bash
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 https://ticketiv.app/ > /dev/null

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require the exact shared UAT target
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in TEST_SUPABASE_URL TEST_SUPABASE_SERVICE_ROLE_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required shared-UAT secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          expected_url="https://${TEST_SUPABASE_ALLOW_PROJECT_REF}.supabase.co"
          if [[ "$TEST_SUPABASE_URL" != "$expected_url" ]]; then
            echo "TEST_SUPABASE_URL does not match the allow-listed project ref." >&2
            exit 1
          fi
          test "$PLAYWRIGHT_BASE_URL" = "https://ticketiv.app"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove database money and scanner lifecycle
        run: pnpm exec vitest run tests/money-path-lifecycle.test.ts

      - name: Run authenticated and privilege-boundary browser UAT serially
        run: >-
          pnpm test:e2e
          e2e/anonymous-privilege-boundaries.spec.ts
          e2e/authenticated-org-boundaries.spec.ts
          e2e/refunded-ticket-propagation.spec.ts
          e2e/organizer-draft-publish-guard.spec.ts
          e2e/workspace-deletion-safety.spec.ts
          e2e/organizer-onboarding.spec.ts
          --project=desktop-chromium
          --workers=1

      - name: Confirm production stayed on the tested commit
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          deployments="$(curl --fail --silent --show-error "${auth[@]}" \
            "${api}/deployments?environment=Production&per_page=20")"
          latest_success_sha=""

          while read -r deployment_id deployment_sha; do
            [[ -n "$deployment_id" && -n "$deployment_sha" ]] || continue
            state="$(curl --fail --silent --show-error "${auth[@]}" \
              "${api}/deployments/${deployment_id}/statuses?per_page=20" \
              | jq -r '.[0].state // empty')"
            if [[ "$state" == "success" ]]; then
              latest_success_sha="$deployment_sha"
              break
            fi
          done < <(jq -r '.[] | select(.creator.login == "vercel[bot]") | [.id, .sha] | @tsv' <<< "$deployments")

          if [[ -z "$latest_success_sha" ]]; then
            echo "Unable to resolve the latest successful Vercel Production deployment." >&2
            exit 1
          fi
          if [[ "$latest_success_sha" != "$TARGET_SHA" ]]; then
            echo "Production changed during UAT: tested $TARGET_SHA but latest successful deployment is $latest_success_sha." >&2
            echo "This run is intentionally invalid; the newer commit must run its own shared UAT." >&2
            exit 1
          fi

          echo "Production remained on $TARGET_SHA for the full UAT run."

      - name: Remove deterministic shared fixtures
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm seed:uat:teardown

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-uat-playwright-${{ github.run_attempt }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
