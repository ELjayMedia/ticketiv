name: Supabase Migration Reconstruction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  reconstruct-production-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show canonical migration chain
        run: |
          set -euo pipefail
          echo "Canonical migration files after the 2026-09-05 production-baseline compaction:"
          find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sort
          echo "Migration count:"
          find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l

      - name: Start local Supabase database
        run: |
          set -euo pipefail
          supabase db start
          supabase status

      - name: Reconstruct schema from canonical migration chain
        run: |
          set -euo pipefail
          # The repository intentionally compacted historical production
          # versions into 20260905000000_production_baseline.sql. Rebuilding a
          # deleted 259-file manifest is no longer a valid test. The release
          # contract is now: baseline + every forward migration must reset from
          # a clean local Supabase database.
          supabase db reset --local --no-seed

      - name: Show applied migrations
        run: supabase migration list --local

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
