name: TEMP copy Access token to UAT
on:
  push:
    branches: [main]
    paths: [.github/workflows/tmp-copy-access-token-to-uat.yml]
permissions:
  contents: read
jobs:
  seal:
    if: github.actor == 'ELjayMedia'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      UAT_KEY: FtoR2j6FNFSMb3DZGW40fejee2elXvC8l9hS22Ylqlg=
    steps:
      - name: Seal to UAT environment public key
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,ctypes,ctypes.util
          s=ctypes.CDLL(ctypes.util.find_library('sodium')); assert s.sodium_init()>=0
          s.crypto_box_seal.argtypes=[ctypes.c_void_p,ctypes.c_void_p,ctypes.c_ulonglong,ctypes.c_void_p]
          pub=base64.b64decode(os.environ['UAT_KEY']); assert len(pub)==32
          for n in ['CLOUDFLARE_ACCESS_CLIENT_ID','CLOUDFLARE_ACCESS_CLIENT_SECRET']:
            raw=os.environ[n].encode(); assert raw, n
            out=ctypes.create_string_buffer(len(raw)+48)
            assert s.crypto_box_seal(out,raw,len(raw),pub)==0
            print('SEALED '+json.dumps({'name':n,'key_id':'3380204578043523366','encrypted_value':base64.b64encode(out.raw).decode()}))
          PY
