name: Create Encrypted Production Recovery Point

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketiv-production-recovery-point
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ vars.TICKETIV_PAYOUT_RESET_MODE == '' }}
    name: Export and encrypt current production state
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_REF: radsfmlsjznqvcpogluo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_AGE_RECIPIENT: ${{ vars.TICKETIV_BACKUP_AGE_RECIPIENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Validate recovery configuration
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$BACKUP_AGE_RECIPIENT" || { echo "::error::Missing TICKETIV_BACKUP_AGE_RECIPIENT"; exit 1; }
          case "$BACKUP_AGE_RECIPIENT" in age1*) ;; *) echo "::error::Invalid age recipient"; exit 1 ;; esac
          sudo apt-get update -qq
          sudo apt-get install -y age

      - name: Export consistent logical database backup
        id: database
        run: |
          set -euo pipefail
          umask 077
          backup_root="$RUNNER_TEMP/ticketiv-recovery"
          database_dir="$backup_root/database"
          mkdir -p "$database_dir"

          supabase db dump --remote="$PROJECT_REF" --file "$database_dir/roles.sql" --role-only
          supabase db dump --remote="$PROJECT_REF" --file "$database_dir/schema.sql"
          supabase db dump --remote="$PROJECT_REF" --file "$database_dir/managed_schema.sql" \
            --schema auth,storage
          supabase db dump --remote="$PROJECT_REF" --file "$database_dir/data.sql" --data-only --use-copy \
            --exclude "storage.buckets_vectors" --exclude "storage.vector_indexes"
          supabase db dump --remote="$PROJECT_REF" --file "$database_dir/history_schema.sql" \
            --schema supabase_migrations
          supabase db dump --remote="$PROJECT_REF" --file "$database_dir/history_data.sql" \
            --schema supabase_migrations --data-only --use-copy

          test -s "$database_dir/roles.sql"
          test -s "$database_dir/schema.sql"
          test -s "$database_dir/managed_schema.sql"
          grep -Eq 'CREATE TABLE.*auth.*users' "$database_dir/managed_schema.sql"
          grep -Eq 'CREATE TABLE.*storage.*objects' "$database_dir/managed_schema.sql"
          test -s "$database_dir/data.sql"
          test -s "$database_dir/history_schema.sql"
          test -s "$database_dir/history_data.sql"

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          printf '%s\n' "$timestamp" > "$database_dir/backup-timestamp.txt"
          printf '%s\n' "$PROJECT_REF" > "$database_dir/project-ref.txt"
          tar -czf "$RUNNER_TEMP/ticketiv-database-${timestamp}.tar.gz" -C "$backup_root" database
          age -r "$BACKUP_AGE_RECIPIENT" \
            -o "$RUNNER_TEMP/ticketiv-database-${timestamp}.tar.gz.age" \
            "$RUNNER_TEMP/ticketiv-database-${timestamp}.tar.gz"
          (cd "$RUNNER_TEMP" && \
            sha256sum "ticketiv-database-${timestamp}.tar.gz.age" \
              > "ticketiv-database-${timestamp}.tar.gz.age.sha256")
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "Database export created and encrypted."

      - name: Inventory and export Storage objects
        run: |
          set -euo pipefail
          umask 077
          timestamp="${{ steps.database.outputs.timestamp }}"
          storage_dir="$RUNNER_TEMP/ticketiv-recovery/storage"
          mkdir -p "$storage_dir"
          node scripts/backup-supabase-storage.mjs "$storage_dir" \
            > "$RUNNER_TEMP/storage-summary.json"
          jq -e '.buckets >= 0 and .objects >= 0 and .bytes >= 0' \
            "$RUNNER_TEMP/storage-summary.json" >/dev/null

          tar -czf "$RUNNER_TEMP/ticketiv-storage-${timestamp}.tar.gz" \
            -C "$RUNNER_TEMP/ticketiv-recovery" storage
          age -r "$BACKUP_AGE_RECIPIENT" \
            -o "$RUNNER_TEMP/ticketiv-storage-${timestamp}.tar.gz.age" \
            "$RUNNER_TEMP/ticketiv-storage-${timestamp}.tar.gz"
          (cd "$RUNNER_TEMP" && \
            sha256sum "ticketiv-storage-${timestamp}.tar.gz.age" \
              > "ticketiv-storage-${timestamp}.tar.gz.age.sha256")
          jq -r '"Storage export encrypted: \(.buckets) buckets, \(.objects) objects, \(.bytes) bytes."' \
            "$RUNNER_TEMP/storage-summary.json"

      - name: Write non-sensitive recovery metadata
        run: |
          set -euo pipefail
          timestamp="${{ steps.database.outputs.timestamp }}"
          cat > "$RUNNER_TEMP/recovery-metadata.json" <<EOF
          {
            "format": 1,
            "projectRef": "$PROJECT_REF",
            "timestamp": "$timestamp",
            "databaseArchive": "ticketiv-database-${timestamp}.tar.gz.age",
            "storageArchive": "ticketiv-storage-${timestamp}.tar.gz.age",
            "encryption": "age-x25519"
          }
          EOF

      - name: Upload encrypted recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ticketiv-recovery-${{ steps.database.outputs.timestamp }}
          path: |
            ${{ runner.temp }}/ticketiv-database-${{ steps.database.outputs.timestamp }}.tar.gz.age
            ${{ runner.temp }}/ticketiv-database-${{ steps.database.outputs.timestamp }}.tar.gz.age.sha256
            ${{ runner.temp }}/ticketiv-storage-${{ steps.database.outputs.timestamp }}.tar.gz.age
            ${{ runner.temp }}/ticketiv-storage-${{ steps.database.outputs.timestamp }}.tar.gz.age.sha256
            ${{ runner.temp }}/recovery-metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext recovery material
        if: always()
        run: |
          find "$RUNNER_TEMP/ticketiv-recovery" -type f -exec shred -u {} + 2>/dev/null || true
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'ticketiv-*.tar.gz' -exec shred -u {} + 2>/dev/null || true

  payout-account-reset:
    if: ${{ vars.TICKETIV_PAYOUT_RESET_MODE == 'dry-run' || vars.TICKETIV_PAYOUT_RESET_MODE == 'apply' }}
    name: Controlled two-account payout reset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESET_MODE: ${{ vars.TICKETIV_PAYOUT_RESET_MODE }}
      RESET_INPUT_JSON: ${{ secrets.PAYOUT_ACCOUNT_RESET_INPUT_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COOLIFY_ENV_TOKEN: ${{ secrets.COOLIFY_ENV_TOKEN }}
      PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY }}
      PAYOUT_ENCRYPTION_KEY_ID: ${{ vars.PAYOUT_ENCRYPTION_KEY_ID }}
      PAYOUT_ACCOUNT_RESET_BACKUP_REFERENCE: ${{ vars.TICKETIV_PAYOUT_RESET_BACKUP_REFERENCE }}
      PAYOUT_ACCOUNT_RESET_REVIEW_REFERENCE: ${{ vars.TICKETIV_PAYOUT_RESET_REVIEW_REFERENCE }}

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate protected operator configuration
        run: |
          set -euo pipefail
          for name in RESET_MODE RESET_INPUT_JSON SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY COOLIFY_ENV_TOKEN PAYOUT_ENCRYPTION_KEY PAYOUT_ENCRYPTION_KEY_ID; do
            test -n "${!name}" || { echo "::error::Missing required operator configuration: ${name}"; exit 1; }
          done
          test "$PAYOUT_ENCRYPTION_KEY_ID" != "2026-09b"
          case "$RESET_MODE" in dry-run|apply) ;; *) echo "::error::Invalid reset mode"; exit 1 ;; esac
          if [ "$RESET_MODE" = apply ]; then
            test -n "$PAYOUT_ACCOUNT_RESET_BACKUP_REFERENCE"
            test -n "$PAYOUT_ACCOUNT_RESET_REVIEW_REFERENCE"
          fi

          umask 077
          printf '%s' "$RESET_INPUT_JSON" > "$RUNNER_TEMP/payout-account-replacements.json"
          chmod 600 "$RUNNER_TEMP/payout-account-replacements.json"
          jq -e '
            (keys | sort) == [
              "80e92d91-e165-4db6-8738-7464953d3b23",
              "8851cf54-4a06-4710-a00d-81fb42c6978e"
            ]
          ' "$RUNNER_TEMP/payout-account-replacements.json" >/dev/null

      - name: Synchronize protected Coolify runtime configuration
        run: |
          set -euo pipefail
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg publishable "$SUPABASE_PUBLISHABLE_KEY" \
            --arg service_role "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg payout_key "$PAYOUT_ENCRYPTION_KEY" \
            --arg payout_key_id "$PAYOUT_ENCRYPTION_KEY_ID" \
            '{data: [
              {key:"SUPABASE_URL", value:$url, is_runtime:true, is_buildtime:false, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_URL", value:$url, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY", value:$publishable, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"NEXT_PUBLIC_SUPABASE_ANON_KEY", value:$publishable, is_runtime:true, is_buildtime:true, is_shown_once:false},
              {key:"SUPABASE_SERVICE_ROLE_KEY", value:$service_role, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"PAYOUT_ENCRYPTION_KEY", value:$payout_key, is_runtime:true, is_buildtime:false, is_shown_once:true},
              {key:"PAYOUT_ENCRYPTION_KEY_ID", value:$payout_key_id, is_runtime:true, is_buildtime:false, is_shown_once:false},
              {key:"DEPLOYMENT_ENV", value:"production", is_runtime:true, is_buildtime:true, is_shown_once:false}
            ]}' \
            | curl --fail-with-body --silent --show-error \
                --retry 3 --retry-all-errors \
                --request PATCH \
                --url "https://coolify.eljaymedia.com/api/v1/applications/zs2jkfesdsmrrftkjgcnoekp/envs/bulk" \
                --header "Authorization: Bearer ${COOLIFY_ENV_TOKEN}" \
                --header "Content-Type: application/json" \
                --data-binary @- \
            > /dev/null
          echo "Coolify runtime configuration synchronized without deployment."

      - name: Execute dry-run preflight
        if: ${{ vars.TICKETIV_PAYOUT_RESET_MODE == 'dry-run' }}
        env:
          PAYOUT_ACCOUNT_RESET_INPUT_FILE: ${{ runner.temp }}/payout-account-replacements.json
        run: |
          set -euo pipefail
          pnpm --silent payouts:reset-internal-test-accounts > "$RUNNER_TEMP/reset-summary.json"
          jq -e '.mode == "dry-run" and .accountCount == 2 and .previousKeyId == "2026-09b"' \
            "$RUNNER_TEMP/reset-summary.json" >/dev/null
          jq '{mode, organizationId, accountIds, accountCount, previousKeyId, replacementKeyId}' \
            "$RUNNER_TEMP/reset-summary.json"

      - name: Execute approved compare-and-swap reset
        if: ${{ vars.TICKETIV_PAYOUT_RESET_MODE == 'apply' }}
        env:
          PAYOUT_ACCOUNT_RESET_CONFIRM: RESET_ELJAYTUNES_INTERNAL_TEST_PAYOUT_ACCOUNTS
          PAYOUT_ACCOUNT_RESET_INPUT_FILE: ${{ runner.temp }}/payout-account-replacements.json
        run: |
          set -euo pipefail
          node scripts/financial-state-fingerprint.mjs > "$RUNNER_TEMP/financial-before.json"
          pnpm --silent payouts:reset-internal-test-accounts -- --apply > "$RUNNER_TEMP/reset-summary.json"
          node scripts/financial-state-fingerprint.mjs > "$RUNNER_TEMP/financial-after.json"
          cmp --silent "$RUNNER_TEMP/financial-before.json" "$RUNNER_TEMP/financial-after.json" || {
            echo "::error::Historical financial records changed during the controlled reset."
            exit 1
          }
          jq -e '.mode == "apply-verification" and .accountCount == 2 and .previousKeyId == "2026-09b"' \
            "$RUNNER_TEMP/reset-summary.json" >/dev/null
          jq '{mode, organizationId, accountIds, accountCount, previousKeyId, replacementKeyId}' \
            "$RUNNER_TEMP/reset-summary.json"
          jq '{financial_state_unchanged: true, tables: (.tables | with_entries(.value = {count: .value.count}))}' \
            "$RUNNER_TEMP/financial-after.json"

      - name: Remove protected operator material
        if: always()
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type f \
            \( -name 'payout-account-replacements.json' -o -name 'financial-*.json' -o -name 'reset-summary.json' \) \
            -exec shred -u {} + 2>/dev/null || true
